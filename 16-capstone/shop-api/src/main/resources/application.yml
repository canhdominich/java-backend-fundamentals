spring:
  application:
    name: shop-api
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/shop?useUnicode=true&connectionTimeZone=UTC}
    username: ${DB_USER:shop}
    password: ${DB_PASSWORD:shop_pw}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  mvc:
    problemdetails:
      enabled: true
  flyway:
    locations: classpath:db/migration

app:
  jwt:
    secret: ${JWT_SECRET:}
    ttl: ${JWT_TTL:PT1H}
  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

server:
  shutdown: graceful

---
spring:
  config:
    activate:
      on-profile: dev
  flyway:
    locations: classpath:db/migration,classpath:db/dev
